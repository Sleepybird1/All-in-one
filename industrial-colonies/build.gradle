plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // The former MineColonies research tree is deliberately retained in the
    // repository as migration/reference data, but physical recipe progression
    // is now authoritative and no research/layout data ships in the runtime JAR.
    exclude('data/industrial_colonies/researches/**')
    exclude('data/industrial_colonies/generated_research_translations.json')
    exclude('assets/industrial_colonies/research_layout/**')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def createJar = file('libs/create-1.21.1-6.0.10.jar')
// Create's public BlockEntry API depends on its bundled Registrate classes.
// Extract the exact nested archive for javac only; do not bundle it in our mod.
def generatedRegistrateApi = layout.buildDirectory.file('generated/compile-jars/Registrate-MC1.21-1.3.0+67.jar')
def extractCreateRegistrateApi = tasks.register('extractCreateRegistrateApi') {
    inputs.file(createJar)
    outputs.file(generatedRegistrateApi)
    doLast {
        def outputJar = generatedRegistrateApi.get().asFile
        outputJar.parentFile.mkdirs()
        def archive = new java.util.zip.ZipFile(createJar)
        try {
            def entry = archive.getEntry('META-INF/jarjar/Registrate-MC1.21-1.3.0+67.jar')
            if (entry == null) throw new GradleException('Create is missing its pinned Registrate compile API')
            archive.getInputStream(entry).withCloseable { nested ->
                java.nio.file.Files.copy(nested, outputJar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally { archive.close() }
    }
}
def bundledPonderPath = 'META-INF/jarjar/ponder-neoforge-1.0.82+mc1.21.1.jar'
def generatedPonderApi = layout.buildDirectory.file(
        'generated/compile-jars/ponder-neoforge-1.0.82+mc1.21.1.jar')
def extractCreatePonderApi = tasks.register('extractCreatePonderApi') {
    inputs.file(createJar)
    outputs.file(generatedPonderApi)

    doLast {
        def outputJar = generatedPonderApi.get().asFile
        outputJar.parentFile.mkdirs()

        def archive = new java.util.zip.ZipFile(createJar)
        try {
            def entry = archive.getEntry(bundledPonderPath)
            if (entry == null) {
                throw new GradleException("Create is missing bundled compile dependency: ${bundledPonderPath}")
            }
            archive.getInputStream(entry).withCloseable { nested ->
                java.nio.file.Files.copy(
                        nested,
                        outputJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            archive.close()
        }
    }
}

def sableJar = file("${pack_mods_dir}/sable-neoforge-1.21.1-2.0.3.jar")
def bundledSableCompanionPath = 'META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar'
def generatedSableCompanionApi = layout.buildDirectory.file(
        'generated/compile-jars/sable-companion-common-1.21.1-1.6.0.jar')
def extractSableCompanionApi = tasks.register('extractSableCompanionApi') {
    inputs.file(sableJar)
    outputs.file(generatedSableCompanionApi)

    doLast {
        def outputJar = generatedSableCompanionApi.get().asFile
        outputJar.parentFile.mkdirs()

        def archive = new java.util.zip.ZipFile(sableJar)
        try {
            def entry = archive.getEntry(bundledSableCompanionPath)
            if (entry == null) {
                throw new GradleException("Sable is missing bundled compile dependency: ${bundledSableCompanionPath}")
            }
            archive.getInputStream(entry).withCloseable { nested ->
                java.nio.file.Files.copy(
                        nested,
                        outputJar.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            archive.close()
        }
    }
}

// Cosmonautics bundles an Orekit javac Plugin service entry whose relocated
// provider is deliberately absent from the runtime mod JAR. Putting the raw
// mod on javac's classpath therefore aborts compilation before source parsing.
// Build a compile-only mirror without service-loader/signature metadata; its
// classes remain byte-for-byte identical to the required runtime dependency.
def cosmonauticsJar = file("${pack_mods_dir}/cosmonautics-26.08.307.jar")
def cosmowarpJar = file("${pack_mods_dir}/cosmowarp-1.0.1.jar")
def generatedCosmonauticsApi = layout.buildDirectory.file(
        'generated/compile-jars/cosmonautics-26.08.307-compile-api.jar')
def extractCosmonauticsGateApi = tasks.register('extractCosmonauticsGateApi', Jar) {
    inputs.file(cosmonauticsJar)
    archiveFileName = 'cosmonautics-26.08.307-compile-api.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/compile-jars')
    from(zipTree(cosmonauticsJar)) {
        exclude 'META-INF/services/**'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
}

dependencies {
    // Create is supplied by the target modpack.  Keeping this as compileOnly
    // prevents the third-party jar from being bundled into Industrial Colonies.
    compileOnly files(createJar)
    // SmartBlockEntity implements this API. Create supplies it at runtime as
    // a jar-in-jar; javac needs the exact bundled jar exposed separately.
    compileOnly files(generatedPonderApi.get().asFile)
    // ServerSubLevel implements an interface supplied from Sable's companion
    // jar-in-jar. Expose that exact API to javac without bundling it.
    compileOnly files(generatedSableCompanionApi.get().asFile)
    compileOnly files(generatedCosmonauticsApi.get().asFile)
    // The final interstellar boundary targets the exact Cosmowarp build in
    // the pack. It is compile-only: the player-supplied runtime JAR remains
    // the sole owner of its blocks, items, components, and networking.
    compileOnly files(cosmowarpJar)
    // KJSGen is the in-game visual recipe editor used by the pack. Its picker
    // has a separate API from KubeJS recipe schemas, so the companion mod also
    // registers two small code-generation adapters for its special editors.
    compileOnly files('libs/kjsgen-neoforge-2.0.5+mc1.21.1.jar')
    // The exact KubeJS build used by the target instance is needed for a narrow
    // OutputFilter compatibility mixin. It prevents an unrelated Hilt SERVER
    // config lifecycle bug from aborting KJSGen-authored output removals.
    compileOnly fileTree(dir: file(pack_mods_dir), include: [
            'kubejs-neoforge-2101.7.2-build.368.jar'
    ])
    // JEI is optional at runtime, but the target pack's exact 19.32 API is
    // needed to merge machine-bound recipes into Create's existing pages.
    // Nothing from JEI is bundled into Industrial Colonies.
    compileOnly fileTree(dir: file(pack_mods_dir), include: [
            'jei-1.21.1-neoforge-19.*.jar'
    ])
    // Resolve compatibility APIs from the exact target instance. MineColonies
    // and FTB stage bridge classes are retained only for old-save migration;
    // physical recipe progression does not register them at runtime.
    compileOnly fileTree(dir: file(pack_mods_dir), include: [
            'minecolonies-*.jar',
            'blockui-*.jar',
            'ftb-teams-*.jar',
            'ftb-library-*.jar',
            'Mekanism-*.jar',
            'ImmersiveEngineering-1.21.1-12.4.2-194.jar',
            'irons_spellbooks-1.21.1-3.16.3.jar',
            'appliedenergistics2-*.jar',
            'ExtendedAE-*.jar',
            'Glodium-*.jar',
            'tfmg-*.jar',
            // Existing optional JEI alias mixin uses this installed addon's public block API.
            'electroenergetics-1.21.1-1.1.1.jar',
            // Optional exact API for fuel/output custody admission; never bundled.
            'stellaris-1.21-neoforge-1.4.25.jar',
            'adastra-1.21.1-1.16.22-neoforge.jar',
            'architectury-13.0.11-neoforge.jar',
            'potentials-neoforge-1.21-0.7.1.jar',
            'ModernFoundry-*.jar',
            'NuclearRadiation-1.21.1-1.0.14.jar',
            'Hilt-*.jar',
            'ExtremeReactors2-*.jar',
            'ZeroCore2-*.jar',
            'createmetallurgy-*.jar',
            'iceandfire-2.1.3.jar',
            'uranus-2.4.1-bugfix-1.21.1-neoforge.jar',
            'create_aeronautics_automated_logistics-*.jar',
            // Optional native firing signatures only; never bundled.
            'createbigcannons-*.jar',
            'sable-neoforge-*.jar'
    ])
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('compileJava').configure {
    dependsOn(extractCreatePonderApi, extractCreateRegistrateApi, extractSableCompanionApi, extractCosmonauticsGateApi)
    // NeoForge's dependency remapping discards plain class directories from
    // compileOnly. Append the extracted jar-in-jar APIs after remapping so
    // javac can resolve Create Catnip/Ponder and Sable companion interfaces.
    classpath += files(
            generatedRegistrateApi.get().asFile,
            generatedPonderApi.get().asFile,
            generatedSableCompanionApi.get().asFile,
            generatedCosmonauticsApi.get().asFile)
    // Fork javac on Windows. The in-process compiler can keep dependency JARs
    // mounted through ZipFS while Gradle attempts to close them, producing a
    // spurious AccessDeniedException even though compilation itself succeeded.
    options.fork = true
    options.forkOptions.executable = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }.get().executablePath.asFile.absolutePath
}

def tierRecipeCatalog = file('src/main/resources/data/industrial_colonies/tier_recipe_environments.json')
def generatedTierSchemas = layout.buildDirectory.dir('generated/tierRecipeSchemas')
def generatedRecipeStages = layout.buildDirectory.dir('generated/recipeStages')
def industrialModId = mod_id.toString()

tasks.register('generateRecipeStageManifest') {
    outputs.file(generatedRecipeStages.map {
        it.file("data/${industrialModId}/progression/recipe_stages.json")
    })

    doLast {
        def outputFile = generatedRecipeStages.get().file(
                "data/${industrialModId}/progression/recipe_stages.json").asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                mode   : 'physical_recipe_progression',
                recipes: [:]
        ])) + System.lineSeparator(), 'UTF-8')
    }
}

tasks.register('generateTierRecipeSchemas') {
    inputs.file(tierRecipeCatalog)
    outputs.dir(generatedTierSchemas)

    doLast {
        def catalog = new groovy.json.JsonSlurper().parse(tierRecipeCatalog)
        def outputRoot = generatedTierSchemas.get().asFile
        if (outputRoot.exists() && !outputRoot.deleteDir()) {
            throw new GradleException("Unable to clear generated schema directory: ${outputRoot}")
        }

        catalog.tiers.each { tier ->
            catalog.recipe_families.each { family ->
                def schema = new File(outputRoot,
                        "data/${industrialModId}/kubejs/recipe_schema/${tier.id}_${family.id}.json")
                schema.parentFile.mkdirs()
                schema.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        parent: "create:${family.schema}"
                ])) + System.lineSeparator()
            }
        }

        // Editor-authored recipes for a native Create machine use a hidden
        // base_<family> serializer. It is what makes "Mechanical Press" an
        // exclusive machine choice rather than a universal native recipe.
        catalog.recipe_families.findAll { (it.machines ?: []).size() > 1 }.each { family ->
            def schema = new File(outputRoot,
                    "data/${industrialModId}/kubejs/recipe_schema/base_${family.id}.json")
            schema.parentFile.mkdirs()
            schema.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    parent: "create:${family.schema}"
            ])) + System.lineSeparator()
        }
    }
}

sourceSets.main.resources.srcDir(generatedTierSchemas)
sourceSets.main.resources.srcDir(generatedRecipeStages)
def removeLegacyKjsgenLayouts = tasks.register('removeLegacyKjsgenLayouts', Delete) {
    // Older builds generated 140 tier x process KJSGen cards. Delete their
    // former output directory before processing resources so an incremental
    // build cannot retain those cards in the final JAR.
    delete(layout.buildDirectory.dir(
            "resources/main/assets/${industrialModId}/kjsgen_layouts"))
}
tasks.named('processResources').configure {
    dependsOn('generateTierRecipeSchemas', 'generateRecipeStageManifest', removeLegacyKjsgenLayouts)
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// The review-history helper is deliberately Minecraft-independent. Compile
// and run its focused regression test as part of `check` without pulling the
// NeoForge/KJSGen main source set into Gradle's otherwise-unused test setup.
def reviewHistoryTestClasses = layout.buildDirectory.dir('review-history-test/classes')
def compileReviewHistoryTest = tasks.register('compileKjsGenReviewHistoryTest', JavaCompile) {
    source(files(
            'src/main/java/dev/godpc/industrialcolonies/KjsGenRecipeViewHistory.java',
            'tools/java/dev/godpc/industrialcolonies/KjsGenRecipeViewHistoryTest.java'))
    classpath = files()
    destinationDirectory = reviewHistoryTestClasses
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    options.encoding = 'UTF-8'
}
def validateReviewHistory = tasks.register('validateKjsGenReviewHistory', JavaExec) {
    dependsOn(compileReviewHistoryTest)
    classpath = files(reviewHistoryTestClasses)
    mainClass = 'dev.godpc.industrialcolonies.KjsGenRecipeViewHistoryTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named('check').configure {
    dependsOn(validateReviewHistory)
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
